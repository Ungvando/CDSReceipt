<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Add New Receipt (Test Form)</title>
<style>
  body { font-family: Arial, Helvetica, sans-serif; margin: 0; background: #f5f6f8; color: #222; }
  .header { background: #2f6ea5; color: #fff; padding: 16px 24px; font-weight: bold; letter-spacing: 0.5px; }
  .panel { background: #fff; margin: 16px; padding: 20px 24px; border-radius: 4px; }
  .row { display: flex; flex-wrap: wrap; gap: 24px; margin-bottom: 16px; }
  .field { display: flex; flex-direction: column; font-size: 13px; color: #333; }
  .field label { font-weight: bold; margin-bottom: 6px; }
  .field input, .field select {
    border: none; border-bottom: 2px solid #b23b3b; padding: 4px 2px; font-size: 14px;
    background: transparent; min-width: 90px;
  }
  .field input:disabled, .field select:disabled {
    background: #e8e8e8; border-bottom: 2px solid #ccc; color: #888;
  }
  .radio-group { display: flex; gap: 20px; align-items: center; margin-bottom: 16px; }
  hr { border: none; border-top: 1px solid #ddd; margin: 16px 0; }
  table { width: 100%; border-collapse: collapse; }
  th { text-align: left; font-size: 13px; padding: 6px 8px; }
  td { padding: 4px 8px; }
  td input, td select { width: 100%; box-sizing: border-box; }
  .item-number { border-bottom: 2px solid #2f6ea5 !important; }
  .btn { border: none; border-radius: 20px; padding: 10px 22px; font-weight: bold; cursor: pointer; }
  .btn-save { background: #4fa8e0; color: #fff; }
  .btn-clear { background: #d9534f; color: #fff; margin-right: 10px; }
  .top-actions { display: flex; justify-content: flex-end; gap: 10px; margin-bottom: 16px; }
  .add-item { color: #2f6ea5; cursor: pointer; font-weight: bold; margin-top: 12px; display: inline-block; }
  .trash { cursor: pointer; color: #2f6ea5; }
  .dollar { color: #888; margin-right: 2px; }
</style>
</head>
<body>

<div class="header">ADD NEW RECEIPT</div>

<div class="panel">

  <div class="radio-group">
    <label><input type="radio" name="type" value="purchase" checked> Purchase</label>
    <label><input type="radio" name="type" value="return"> Return</label>
  </div>

  <div class="top-actions">
    <button class="btn btn-clear" onclick="clearPage()">CLEAR PAGE</button>
    <button class="btn btn-save" onclick="saveForm()">SAVE</button>
  </div>

  <div class="row">
    <div class="field">
      <label>Receipt Sub Total</label>
      <input type="number" step="0.01" id="receiptSubTotal" name="receiptSubTotal" value="0">
    </div>
    <div class="field">
      <label>Receipt Tax</label>
      <input type="number" step="0.01" id="receiptTax" name="receiptTax" value="0">
    </div>
    <div class="field">
      <label>Allocated Subtotal</label>
      <input type="number" step="0.01" id="allocatedSubtotal" name="allocatedSubtotal" value="0.00" disabled>
    </div>
    <div class="field">
      <label>Allocated Tax</label>
      <input type="number" step="0.01" id="allocatedTax" name="allocatedTax" value="0.00" disabled>
    </div>
    <div class="field">
      <label>Allocated Grand Total</label>
      <input type="number" step="0.01" id="allocatedGrandTotal" name="allocatedGrandTotal" value="0.00" disabled>
    </div>
    <div class="field">
      <label>Variance</label>
      <input type="number" step="0.01" id="variance" name="variance" value="0.00" disabled>
    </div>
    <div class="field">
      <label>Tax Variance</label>
      <input type="number" step="0.01" id="taxVariance" name="taxVariance" value="0.00" disabled>
    </div>
  </div>

  <hr>

  <div class="row">
    <div class="field">
      <label>Receipt Number</label>
      <input type="text" id="receiptNumber" name="receiptNumber">
    </div>
    <div class="field">
      <label>Receipt Date</label>
      <input type="text" id="receiptDate" name="receiptDate" placeholder="MM/DD/YYYY">
    </div>
    <div class="field">
      <label>Event Date</label>
      <input type="text" id="eventDate" name="eventDate" placeholder="MM/DD/YYYY">
    </div>
  </div>

  <hr>

  <table id="itemsTable">
    <thead>
      <tr>
        <th>Item Number</th>
        <th>Description</th>
        <th>Item Type</th>
        <th>Assigned To/ Reason</th>
        <th>Per lbs.</th>
        <th>Units/lbs</th>
        <th>Cost Per</th>
        <th>Subtotal</th>
        <th>Tax</th>
        <th>Tax Amount</th>
        <th>Total cost</th>
        <th></th>
      </tr>
    </thead>
    <tbody id="itemsBody">
      <!-- rows injected here -->
    </tbody>
  </table>

  <span class="add-item" onclick="addItemRow()">&#10133; ADD ANOTHER ITEM</span>

</div>

<script>
let itemCount = 0;

function addItemRow() {
  itemCount++;
  const tbody = document.getElementById('itemsBody');
  const row = document.createElement('tr');
  row.dataset.rowId = itemCount;
  row.innerHTML = `
    <td><input type="text" class="item-number" name="itemNumber_${itemCount}"></td>
    <td><input type="text" name="description_${itemCount}"></td>
    <td>
      <select name="itemType_${itemCount}">
        <option value=""></option>
        <option value="grocery">Grocery</option>
        <option value="supplies">Supplies</option>
        <option value="equipment">Equipment</option>
        <option value="other">Other</option>
      </select>
    </td>
    <td><input type="text" name="assignedTo_${itemCount}"></td>
    <td style="text-align:center;"><input type="checkbox" name="perLbs_${itemCount}" onchange="recalcRow(${itemCount})"></td>
    <td><input type="number" step="0.01" name="units_${itemCount}" value="0" oninput="recalcRow(${itemCount})"></td>
    <td><span class="dollar">$</span><input type="number" step="0.01" name="costPer_${itemCount}" value="0" oninput="recalcRow(${itemCount})"></td>
    <td><span class="dollar">$</span><input type="number" step="0.01" name="subtotal_${itemCount}" value="0.00" disabled></td>
    <td>
      <select name="taxRate_${itemCount}" onchange="recalcRow(${itemCount})">
        <option value="0">No Tax - 0%</option>
        <option value="0.0725">7.25%</option>
        <option value="0.09">9%</option>
        <option value="0.105">10.5%</option>
      </select>
    </td>
    <td><span class="dollar">$</span><input type="number" step="0.01" name="taxAmount_${itemCount}" value="0.00" disabled></td>
    <td><span class="dollar">$</span><input type="number" step="0.01" name="totalCost_${itemCount}" value="0.00" disabled></td>
    <td><span class="trash" onclick="removeRow(${itemCount})">&#128465;</span></td>
  `;
  tbody.appendChild(row);
}

function recalcRow(id) {
  const units = parseFloat(document.querySelector(`[name="units_${id}"]`).value) || 0;
  const costPer = parseFloat(document.querySelector(`[name="costPer_${id}"]`).value) || 0;
  const taxRate = parseFloat(document.querySelector(`[name="taxRate_${id}"]`).value) || 0;

  const subtotal = units * costPer;
  const taxAmount = subtotal * taxRate;
  const total = subtotal + taxAmount;

  document.querySelector(`[name="subtotal_${id}"]`).value = subtotal.toFixed(2);
  document.querySelector(`[name="taxAmount_${id}"]`).value = taxAmount.toFixed(2);
  document.querySelector(`[name="totalCost_${id}"]`).value = total.toFixed(2);

  recalcHeader();
}

function recalcHeader() {
  let subtotalSum = 0, taxSum = 0;
  document.querySelectorAll('#itemsBody tr').forEach(row => {
    const id = row.dataset.rowId;
    subtotalSum += parseFloat(document.querySelector(`[name="subtotal_${id}"]`).value) || 0;
    taxSum += parseFloat(document.querySelector(`[name="taxAmount_${id}"]`).value) || 0;
  });

  document.getElementById('allocatedSubtotal').value = subtotalSum.toFixed(2);
  document.getElementById('allocatedTax').value = taxSum.toFixed(2);
  document.getElementById('allocatedGrandTotal').value = (subtotalSum + taxSum).toFixed(2);

  const receiptSubTotal = parseFloat(document.getElementById('receiptSubTotal').value) || 0;
  const receiptTax = parseFloat(document.getElementById('receiptTax').value) || 0;

  document.getElementById('variance').value = (receiptSubTotal - subtotalSum).toFixed(2);
  document.getElementById('taxVariance').value = (receiptTax - taxSum).toFixed(2);
}

function removeRow(id) {
  const row = document.querySelector(`tr[data-row-id="${id}"]`);
  if (row) row.remove();
  recalcHeader();
}

function clearPage() {
  document.getElementById('itemsBody').innerHTML = '';
  document.getElementById('receiptSubTotal').value = 0;
  document.getElementById('receiptTax').value = 0;
  document.getElementById('receiptNumber').value = '';
  document.getElementById('receiptDate').value = '';
  document.getElementById('eventDate').value = '';
  itemCount = 0;
  addItemRow();
  recalcHeader();
}

function saveForm() {
  alert('Test form only — SAVE does nothing here. Check field values in devtools if needed.');
}

document.getElementById('receiptSubTotal').addEventListener('input', recalcHeader);
document.getElementById('receiptTax').addEventListener('input', recalcHeader);

// start with 3 empty rows like the screenshot
addItemRow();
addItemRow();
addItemRow();
</script>

</body>
</html>
